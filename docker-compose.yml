version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: college_ai_postgres
    environment:
      POSTGRES_USER: college_ai
      POSTGRES_PASSWORD: college_ai_secret
      POSTGRES_DB: college_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college_ai -d college_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
