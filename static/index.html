<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MITS Academic Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f5fa; --panel: #ffffff; --text: #1c2130; --muted: #667085;
    --brand: #1f3864; --brand-text: #ffffff; --user: #1f3864; --user-text: #ffffff;
    --bot: #eef1f7; --border: #d9dde7; --warn: #b54708; --danger: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b1f2a; --text: #e8eaf0; --muted: #9aa3b5;
      --brand: #5b8def; --brand-text: #0b1020; --user: #5b8def; --user-text: #0b1020;
      --bot: #262c3a; --border: #313849; --warn: #f79009; --danger: #f97066;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.45;
  }
  .hidden { display: none !important; }

  /* ---------- sign in ---------- */
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
  }
  .card h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .card p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 4px; color: var(--muted); }
  input[type=email], input[type=password], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  button.primary {
    margin-top: 18px; width: 100%; padding: 11px; border: 0; border-radius: 10px;
    background: var(--brand); color: var(--brand-text); font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--danger); font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; }

  /* ---------- chat ---------- */
  #chat { height: 100%; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; background: var(--panel); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  header .title { font-weight: 700; }
  header .sub { font-size: 0.8rem; color: var(--muted); }
  header .grow { flex: 1; min-width: 0; }
  header button { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 0.85rem; }
  #clock { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-direction: column; max-width: 85%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.bot { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 16px; word-wrap: break-word; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; }
  .meta { font-size: 0.72rem; color: var(--muted); margin: 3px 6px 0; }
  .meta .warn { color: var(--warn); font-weight: 600; }
  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  #chips button { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 0.85rem; }
  #chips button:hover { border-color: var(--brand); }
  form#composer { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--border); }
  form#composer textarea { flex: 1; resize: none; height: 44px; }
  form#composer button { border: 0; border-radius: 10px; padding: 0 18px; background: var(--brand); color: var(--brand-text); font: inherit; font-weight: 600; cursor: pointer; }
  form#composer button:disabled { opacity: 0.5; cursor: default; }
  @media (max-width: 600px) { .row { max-width: 94%; } #clock { display: none; } }
</style>
</head>
<body>
<noscript>This page needs JavaScript.</noscript>

<!-- Sign in -->
<section id="login">
  <form class="card" id="loginForm">
    <h1>MITS Academic Assistant</h1>
    <p>Sign in to ask about your timetable.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="loginBtn" type="submit">Sign in</button>
    <div class="error" id="loginError" role="alert"></div>
  </form>
</section>

<!-- Chat -->
<section id="chat" class="hidden">
  <header>
    <div class="grow">
      <div class="title">MITS Academic Assistant</div>
      <div class="sub" id="who">Signed in</div>
    </div>
    <div id="clock"></div>
    <button id="logoutBtn" type="button">Sign out</button>
  </header>
  <div id="messages" aria-live="polite"></div>
  <div id="chips"></div>
  <form id="composer">
    <textarea id="input" placeholder="Ask about your classes..." aria-label="Your question" maxlength="500"></textarea>
    <button id="sendBtn" type="submit">Send</button>
  </form>
</section>

<script>
"use strict";
const API = "/api/v1";
const SUGGESTIONS = [
  "What is my next class?",
  "What do I have today?",
  "What about tomorrow?",
  "Show my timetable for the week",
  "When is my next lab?",
];

const state = {
  access: sessionStorage.getItem("access"),
  refresh: sessionStorage.getItem("refresh"),
  history: [],
  busy: false,
};

const $ = (id) => document.getElementById(id);
const loginSection = $("login"), chatSection = $("chat");
const messages = $("messages"), input = $("input"), sendBtn = $("sendBtn");

/* ---------- small helpers ---------- */
function saveTokens(access, refresh) {
  state.access = access;
  if (refresh) state.refresh = refresh;
  sessionStorage.setItem("access", state.access || "");
  if (state.refresh) sessionStorage.setItem("refresh", state.refresh);
}

function clearTokens() {
  state.access = state.refresh = null;
  sessionStorage.removeItem("access");
  sessionStorage.removeItem("refresh");
}

// Show text safely (no innerHTML): keeps line breaks, **bold**, and "* item" bullets.
function renderText(el, text) {
  el.textContent = "";
  String(text).split("\n").forEach((rawLine, i) => {
    if (i) el.appendChild(document.createElement("br"));
    const line = rawLine.replace(/^\s*[*-]\s+/, "\u2022 ");
    line.split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
      if (/^\*\*[^*]+\*\*$/.test(part)) {
        const strong = document.createElement("strong");
        strong.textContent = part.slice(2, -2);
        el.appendChild(strong);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    });
  });
}

function scrollToBottom() { messages.scrollTop = messages.scrollHeight; }

function addMessage(role, text, data) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  renderText(bubble, text);
  row.appendChild(bubble);
  if (data) {
    const meta = document.createElement("div");
    meta.className = "meta";
    const bits = [];
    if (data.fallback) {
      const warn = document.createElement("span");
      warn.className = "warn";
      warn.textContent = "Quick answer (AI busy)";
      meta.appendChild(warn);
    } else if ((data.tools_used || []).length) {
      bits.push("From your timetable");
    }
    if (typeof data.elapsed_ms === "number") bits.push((data.elapsed_ms / 1000).toFixed(1) + " s");
    if (bits.length) meta.appendChild(document.createTextNode((data.fallback ? " \u00b7 " : "") + bits.join(" \u00b7 ")));
    row.appendChild(meta);
  }
  messages.appendChild(row);
  scrollToBottom();
  return row;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "row bot";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const dots = document.createElement("span");
  dots.className = "typing";
  dots.innerHTML = "<span></span><span></span><span></span>";
  bubble.appendChild(dots);
  bubble.appendChild(document.createTextNode("  Looking that up\u2026"));
  row.appendChild(bubble);
  messages.appendChild(row);
  scrollToBottom();
  return row;
}

/* ---------- API calls (with one automatic token refresh) ---------- */
async function refreshToken() {
  if (!state.refresh) return false;
  try {
    const res = await fetch(API + "/auth/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: state.refresh }),
    });
    if (!res.ok) return false;
    const data = await res.json();
    if (!data.access_token) return false;
    saveTokens(data.access_token, null);
    return true;
  } catch (err) {
    return false;
  }
}

async function api(path, options = {}) {
  const { method = "GET", body } = options;
  const run = () => fetch(API + path, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(state.access ? { Authorization: "Bearer " + state.access } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let res = await run();
  if (res.status === 401 && state.refresh && (await refreshToken())) res = await run();
  return res;
}

/* ---------- screens ---------- */
function showLogin(message) {
  chatSection.classList.add("hidden");
  loginSection.classList.remove("hidden");
  $("loginError").textContent = message || "";
  $("password").value = "";
  $("email").focus();
}

async function showChat() {
  loginSection.classList.add("hidden");
  chatSection.classList.remove("hidden");
  messages.textContent = "";
  state.history = [];
  $("clock").textContent = "";
  $("who").textContent = "Signed in";

  const chips = $("chips");
  chips.textContent = "";
  SUGGESTIONS.forEach((q) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = q;
    b.addEventListener("click", () => send(q));
    chips.appendChild(b);
  });

  let role = "";
  try {
    const res = await api("/auth/me");
    if (res.ok) {
      const me = await res.json();
      role = me.role || "";
      $("who").textContent = [me.email, role].filter(Boolean).join(" \u00b7 ") || "Signed in";
    }
  } catch (err) { /* the chat still works without this */ }

  if (role === "admin") {
    addMessage("bot", "You are signed in as an administrator. The assistant answers timetable questions for students and faculty accounts.");
  } else {
    addMessage("bot", "Hi! Ask me about your classes: what is next, what is today, or your timetable for a day or the week.");
  }
  input.focus();
}

function logout(message) {
  clearTokens();
  showLogin(message);
}

/* ---------- sending a question ---------- */
function setBusy(busy) {
  state.busy = busy;
  sendBtn.disabled = busy;
  input.disabled = busy;
}

async function send(text) {
  const question = (text || "").trim();
  if (state.busy || !question) return;
  addMessage("user", question);
  input.value = "";
  setBusy(true);
  const typing = addTyping();
  try {
    const res = await api("/chat", {
      method: "POST",
      body: { message: question, history: state.history.slice(-12) },
    });
    typing.remove();
    if (res.status === 401) { logout("Your session expired. Please sign in again."); return; }
    if (res.status === 403) { addMessage("bot", "The assistant is available to student and faculty accounts."); return; }
    if (res.status === 422) { addMessage("bot", "That message could not be sent. It may be empty or too long."); return; }
    if (!res.ok) { addMessage("bot", "Something went wrong on the server. Please try again."); return; }
    const data = await res.json();
    addMessage("bot", data.reply || "(no answer)", data);
    if (data.assistant_time) $("clock").textContent = "Assistant clock: " + data.assistant_time;
    state.history.push(
      { role: "user", text: question.slice(0, 500) },
      { role: "model", text: String(data.reply || "").slice(0, 500) }
    );
  } catch (err) {
    typing.remove();
    addMessage("bot", "Could not reach the server. Check the connection and try again.");
  } finally {
    setBusy(false);
    input.focus();
  }
}

/* ---------- wiring ---------- */
$("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const btn = $("loginBtn");
  btn.disabled = true;
  $("loginError").textContent = "";
  try {
    const res = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value }),
    });
    if (res.status === 401) { $("loginError").textContent = "Wrong email or password."; return; }
    if (!res.ok) { $("loginError").textContent = "Could not sign in. Please try again."; return; }
    const data = await res.json();
    saveTokens(data.access_token, data.refresh_token);
    await showChat();
  } catch (err) {
    $("loginError").textContent = "Could not reach the server.";
  } finally {
    btn.disabled = false;
  }
});

$("composer").addEventListener("submit", (event) => { event.preventDefault(); send(input.value); });
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(input.value); }
});
$("logoutBtn").addEventListener("click", () => logout(""));

// If a session is already stored in this browser tab, go straight to the chat.
(async function start() {
  if (!state.access) { showLogin(""); return; }
  try {
    const res = await api("/auth/me");
    if (res.ok) { await showChat(); return; }
  } catch (err) { /* fall through to the sign-in screen */ }
  logout("");
})();
</script>
</body>
</html>
